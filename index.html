<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 50 Live Screener (Fast Fetch)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --accent-color: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 { margin: 0; font-size: 22px; color: #38bdf8; }
        .status { font-size: 13px; color: #94a3b8; }

        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        tr:hover { background-color: #26354a; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }

        .badge-bullish { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .badge-bearish { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-buy { background-color: #22c55e; color: black; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .btn-refresh {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-refresh:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🚀 Nifty 50 Live Screener</h1>
            <span class="status" id="lastUpdated">Status: Fetching Live Data...</span>
        </div>
        <button class="btn-refresh" onclick="loadAllStocks()">🔄 Refresh Live Data</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Stock Name</th>
                    <th>Live Price</th>
                    <th>Change (%)</th>
                    <th>Trend Status</th>
                    <th>Buy Trigger</th>
                    <th>Support Level</th>
                    <th>Resistance 1</th>
                    <th>Agala Resistance (R2)</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <tr><td colspan="8" style="text-align: center; padding: 20px;">Live Data Load Ho Raha Hai... Kripya Wait Karein.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Nifty 50 Stocks List
        const stocksList = [
            "RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "INFY.NS", "ICICIBANK.NS",
            "BHARTIARTL.NS", "SBIN.NS", "TATAMOTORS.NS", "LTIM.NS", "AXISBANK.NS"
        ];

        async function fetchSingleStock(symbol) {
            // Direct Public Endpoint (Without proxy block)
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`;
            
            // Backup CORS proxy fallback mechanism
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy);
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    const result = data.chart.result[0];
                    const meta = result.meta;
                    
                    const price = meta.regularMarketPrice;
                    const prevClose = meta.chartPreviousClose || meta.previousClose;
                    const changePercent = ((price - prevClose) / prevClose) * 100;
                    const dayHigh = meta.regularMarketDayHigh || (price * 1.01);
                    const dayLow = meta.regularMarketDayLow || (price * 0.99);

                    return {
                        symbol: symbol.replace(".NS", ""),
                        price: price,
                        change: changePercent,
                        high: dayHigh,
                        low: dayLow
                    };
                } catch (e) {
                    // Failover to next proxy if one fails
                    continue;
                }
            }
            return null;
        }

        async function loadAllStocks() {
            const tbody = document.getElementById("stockTableBody");
            const lastUpdatedLabel = document.getElementById("lastUpdated");
            
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 20px;">Fetching Live Data...</td></tr>`;

            // Parallel Fast Data Fetching
            const stockPromises = stocksList.map(sym => fetchSingleStock(sym));
            const results = await Promise.all(stockPromises);
            
            tbody.innerHTML = "";

            let validCount = 0;

            results.forEach(stock => {
                if (!stock) return;
                validCount++;

                const isBullish = stock.change >= 0;
                const isStrongBuy = stock.change > 0.7; // 0.7% se jyada upar -> Strong Buy
                
                const support = (stock.low * 0.995).toFixed(2);
                const resistance1 = (stock.high).toFixed(2);
                const resistance2 = (stock.high * 1.015).toFixed(2);

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td><strong>${stock.symbol}</strong></td>
                    <td>₹${stock.price.toFixed(2)}</td>
                    <td style="color: ${isBullish ? '#4ade80' : '#f87171'}; font-weight: bold;">
                        ${stock.change >= 0 ? '+' : ''}${stock.change.toFixed(2)}%
                    </td>
                    <td>
                        <span class="badge ${isBullish ? 'badge-bullish' : 'badge-bearish'}">
                            ${isBullish ? 'BULLISH 📈' : 'BEARISH 📉'}
                        </span>
                    </td>
                    <td>
                        <span class="badge ${isStrongBuy ? 'badge-buy' : ''}">
                            ${isStrongBuy ? 'BUY ENTRY 🔥' : (isBullish ? 'HOLD / BUY ON DIP' : 'WAIT / NO ENTRY')}
                        </span>
                    </td>
                    <td style="color: #4ade80;">₹${support}</td>
                    <td style="color: #f87171;">₹${resistance1}</td>
                    <td style="color: #f87171; font-weight: bold;">₹${resistance2}</td>
                `;

                tbody.appendChild(row);
            });

            if (validCount === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #f87171;">Network Error: Browser Extension (AdBlocker) off karke dekhein ya Refresh karein.</td></tr>`;
                lastUpdatedLabel.innerText = "Status: Fetch Failed";
            } else {
                const now = new Date();
                lastUpdatedLabel.innerText = `Last Updated: ${now.toLocaleTimeString()}`;
            }
        }

        // Auto Load On Page Open
        loadAllStocks();
    </script>
</body>
</html>
