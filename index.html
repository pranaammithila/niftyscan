<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 50 Live Free API Screener</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --bullish-color: #22c55e;
            --bearish-color: #ef4444;
            --border-color: #334155;
            --accent-color: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 { margin: 0; font-size: 22px; color: #38bdf8; }

        .status {
            font-size: 13px;
            color: #94a3b8;
        }

        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        tr:hover { background-color: #26354a; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }

        .badge-bullish { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .badge-bearish { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-buy { background-color: #22c55e; color: black; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .btn-refresh {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-refresh:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🚀 Nifty 50 Live API Screener</h1>
            <span class="status" id="lastUpdated">Status: Loading Live Data...</span>
        </div>
        <button class="btn-refresh" onclick="fetchLiveStockData()">🔄 Refresh Live Data</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Stock Name</th>
                    <th>Live Price</th>
                    <th>Change (%)</th>
                    <th>Trend Status</th>
                    <th>Buy Trigger</th>
                    <th>Support Level</th>
                    <th>Resistance 1</th>
                    <th>Agala Resistance (R2)</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <tr><td colspan="8" style="text-align: center; padding: 20px;">Fetching Live Market Data... Please wait.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Nifty 50 Symbols (Yahoo Finance NSE Extension)
        const stocksList = [
            { symbol: "RELIANCE.NS", name: "RELIANCE" },
            { symbol: "TCS.NS", name: "TCS" },
            { symbol: "HDFCBANK.NS", name: "HDFCBANK" },
            { symbol: "INFY.NS", name: "INFY" },
            { symbol: "ICICIBANK.NS", name: "ICICIBANK" },
            { symbol: "BHARTIARTL.NS", name: "BHARTIARTL" },
            { symbol: "SBIN.NS", name: "SBIN" },
            { symbol: "TATAMOTORS.NS", name: "TATAMOTORS" },
            { symbol: "LTIM.NS", name: "LTIM" },
            { symbol: "AXISBANK.NS", name: "AXISBANK" }
        ];

        async function fetchLiveStockData() {
            const tbody = document.getElementById("stockTableBody");
            const lastUpdatedLabel = document.getElementById("lastUpdated");
            
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 20px;">Fetching Live Market Data...</td></tr>`;

            try {
                // Free Public Yahoo Finance API Proxy
                const symbolsQuery = stocksList.map(s => s.symbol).join(',');
                const apiUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolsQuery}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

                const response = await fetch(proxyUrl);
                const data = await response.json();
                const resultData = JSON.parse(data.contents).quoteResponse.result;

                tbody.innerHTML = "";

                resultData.forEach(stock => {
                    const price = stock.regularMarketPrice;
                    const change = stock.regularMarketChangePercent;
                    const dayHigh = stock.regularMarketDayHigh || price * 1.01;
                    const dayLow = stock.regularMarketDayLow || price * 0.99;

                    // Technical Logic Calculations (Dynamic)
                    const isBullish = change >= 0;
                    const isStrongBuy = change > 0.8; // Agar 0.8% se jyada upar hai
                    const support = (dayLow * 0.995).toFixed(2);
                    const resistance1 = (dayHigh).toFixed(2);
                    const resistance2 = (dayHigh * 1.015).toFixed(2);

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td><strong>${stock.symbol.replace(".NS", "")}</strong></td>
                        <td>₹${price.toFixed(2)}</td>
                        <td style="color: ${isBullish ? '#4ade80' : '#f87171'}; font-weight: bold;">
                            ${change >= 0 ? '+' : ''}${change.toFixed(2)}%
                        </td>
                        <td>
                            <span class="badge ${isBullish ? 'badge-bullish' : 'badge-bearish'}">
                                ${isBullish ? 'BULLISH 📈' : 'BEARISH 📉'}
                            </span>
                        </td>
                        <td>
                            <span class="badge ${isStrongBuy ? 'badge-buy' : ''}">
                                ${isStrongBuy ? 'BUY ENTRY 🔥' : (isBullish ? 'HOLD / BUY ON DIP' : 'WAIT / NO ENTRY')}
                            </span>
                        </td>
                        <td style="color: #4ade80;">₹${support}</td>
                        <td style="color: #f87171;">₹${resistance1}</td>
                        <td style="color: #f87171; font-weight: bold;">₹${resistance2}</td>
                    `;

                    tbody.appendChild(row);
                });

                const now = new Date();
                lastUpdatedLabel.innerText = `Last Live Fetch: ${now.toLocaleTimeString()}`;

            } catch (error) {
                console.error("API Fetch Error:", error);
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #f87171;">Failed to load live data. Refresh click karke try karein.</td></tr>`;
            }
        }

        // Page load hote hi data fetch hoga
        fetchLiveStockData();
    </script>
</body>
</html>
