<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty 50 Smart Buy/Sell Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --bullish-color: #22c55e;
            --bearish-color: #ef4444;
            --border-color: #334155;
            --accent-color: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 { margin: 0; font-size: 24px; color: #38bdf8; }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: white;
            outline: none;
        }

        input { flex-grow: 1; }

        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        tr:hover { background-color: #26354a; }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }

        .badge-bullish { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .badge-bearish { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-buy { background-color: #22c55e; color: black; animation: pulse 1.5s infinite; }

        .vol-high { color: #facc15; font-weight: bold; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .refresh-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 Nifty 50 Buy/Sell Signal Screener</h1>
        <button class="refresh-btn" onclick="loadStockData()">🔄 Refresh Signals</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Stock Ka Naam Khoje (e.g. RELIANCE)..." onkeyup="filterStocks()">
        <select id="trendFilter" onchange="filterStocks()">
            <option value="ALL">Sabhi Trend Dekhein</option>
            <option value="BUY">Keval BUY Entry Waale</option>
            <option value="Bullish">Keval Bullish</option>
            <option value="Bearish">Keval Bearish</option>
        </select>
    </div>

    <div class="table-container">
        <table id="stockTable">
            <thead>
                <tr>
                    <th>Stock Name</th>
                    <th>Current Price</th>
                    <th>Trend Status</th>
                    <th>Buy Trigger / Signal</th>
                    <th>Chart Pattern</th>
                    <th>Volume Alert</th>
                    <th>Support Level</th>
                    <th>Resistance 1</th>
                    <th>Agala Resistance (R2)</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <!-- Data Javascript Se Load Hoga -->
            </tbody>
        </table>
    </div>

    <script>
        // Nifty 50 Dynamic Analysis Sample Dataset
        const niftyStocks = [
            { name: "RELIANCE", price: 2950.50, trend: "Bullish", signal: "BUY NEAR SUPPORT", pattern: "Double Bottom", volume: "High ⚡", s1: 2910.00, r1: 2980.00, r2: 3040.00 },
            { name: "TCS", price: 3820.00, trend: "Bearish", signal: "WAIT / NO ENTRY", pattern: "Head & Shoulders", volume: "Normal", s1: 3780.00, r1: 3890.00, r2: 3950.00 },
            { name: "HDFCBANK", price: 1640.25, trend: "Bullish", signal: "BUY ENTRY 🔥", pattern: "Breakout", volume: "Very High 🔥", s1: 1610.00, r1: 1650.00, r2: 1700.00 },
            { name: "INFY", price: 1510.00, trend: "Bearish", signal: "RESISTANCE BREAKOUT FAIL", pattern: "Triangle Breakdown", volume: "High ⚡", s1: 1480.00, r1: 1540.00, r2: 1580.00 },
            { name: "ICICIBANK", price: 1120.80, trend: "Bullish", signal: "BUY ENTRY 🔥", pattern: "Cup & Handle", volume: "Very High 🔥", s1: 1100.00, r1: 1135.00, r2: 1160.00 },
            { name: "TATAMOTORS", price: 980.00, trend: "Bullish", signal: "HOLD / BUY ON DIP", pattern: "Uptrend Channel", volume: "Normal", s1: 950.00, r1: 1010.00, r2: 1050.00 },
            { name: "SBIN", price: 840.15, trend: "Bearish", signal: "WAIT / SELL ON RISE", pattern: "Lower Low", volume: "Normal", s1: 820.00, r1: 860.00, r2: 890.00 },
            { name: "BHARTIARTL", price: 1420.00, trend: "Bullish", signal: "BUY ENTRY 🔥", pattern: "Flag Pattern", volume: "High ⚡", s1: 1390.00, r1: 1450.00, r2: 1500.00 }
        ];

        function loadStockData() {
            const tbody = document.getElementById("stockTableBody");
            tbody.innerHTML = "";

            niftyStocks.forEach(stock => {
                const isBuy = stock.signal.includes("BUY ENTRY");
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td><strong>${stock.name}</strong></td>
                    <td>₹${stock.price.toFixed(2)}</td>
                    <td><span class="badge ${stock.trend === 'Bullish' ? 'badge-bullish' : 'badge-bearish'}">${stock.trend}</span></td>
                    <td><span class="badge ${isBuy ? 'badge-buy' : ''}">${stock.signal}</span></td>
                    <td>${stock.pattern}</td>
                    <td class="${stock.volume.includes('High') ? 'vol-high' : ''}">${stock.volume}</td>
                    <td style="color: #4ade80;">₹${stock.s1.toFixed(2)}</td>
                    <td style="color: #f87171;">₹${stock.r1.toFixed(2)}</td>
                    <td style="color: #f87171; font-weight: bold;">₹${stock.r2.toFixed(2)}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function filterStocks() {
            const searchValue = document.getElementById("searchInput").value.toUpperCase();
            const filterValue = document.getElementById("trendFilter").value;
            const rows = document.getElementById("stockTableBody").getElementsByTagName("tr");

            for (let i = 0; i < rows.length; i++) {
                const stockName = rows[i].getElementsByTagName("td")[0].innerText;
                const trend = rows[i].getElementsByTagName("td")[2].innerText;
                const signal = rows[i].getElementsByTagName("td")[3].innerText;

                let matchesSearch = stockName.toUpperCase().indexOf(searchValue) > -1;
                let matchesFilter = false;

                if (filterValue === "ALL") matchesFilter = true;
                else if (filterValue === "BUY" && signal.includes("BUY")) matchesFilter = true;
                else if (filterValue === "Bullish" && trend.includes("Bullish")) matchesFilter = true;
                else if (filterValue === "Bearish" && trend.includes("Bearish")) matchesFilter = true;

                if (matchesSearch && matchesFilter) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }

        // Auto load initial data
        loadStockData();
    </script>
</body>
</html>
