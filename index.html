<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Live NSE Scanner & OI Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .scanner-box {
      width: 100%;
      max-width: 650px;
      background: #1e293b;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header h2 { margin: 0; font-size: 20px; color: #38bdf8; }
    .live-dot {
      height: 10px;
      width: 10px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
      text-transform: uppercase;
    }
    button {
      padding: 10px 18px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #0f172a;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .stat-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .stat-val { font-size: 18px; font-weight: bold; }
    
    .signal-box {
      padding: 15px;
      border-radius: 8px;
      background: #0f172a;
      border-left: 5px solid #38bdf8;
      text-align: center;
    }
    .action { font-size: 24px; font-weight: 800; margin: 5px 0; }
    .buy { color: #22c55e; }
    .sell { color: #ef4444; }
    .neutral { color: #facc15; }
    .targets {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div class="scanner-box">
  <div class="header">
    <h2>NSE Live OI + Signal Engine</h2>
    <div><span class="live-dot"></span><span id="syncTime">Live</span></div>
  </div>

  <div class="search-row">
    <input type="text" id="stockSymbol" value="SBIN" placeholder="Enter Symbol (e.g. SBIN, TATASTEEL)">
    <button onclick="fetchLiveData()">Scan Stock</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Last Traded Price (CMP)</div>
      <div class="stat-val" id="cmp">₹0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">OI Trend Status</div>
      <div class="stat-val" id="oiTrend">-</div>
    </div>
  </div>

  <div class="signal-box">
    <div class="stat-label">Market Action Signal</div>
    <div class="action neutral" id="signal">-</div>
    <div id="interpretation" style="font-size: 13px; color: #cbd5e1; margin-top: 5px;"></div>

    <div class="targets">
      <div><strong>Target:</strong> <span id="target" style="color:#38bdf8;">-</span></div>
      <div><strong>Stop Loss:</strong> <span id="sl" style="color:#f43f5e;">-</span></div>
    </div>
  </div>
</div>

<script>
// Yahan apna Google Web App URL paste karein
const API_URL = "https://script.google.com/macros/s/AKfycbyd7dqKDnKLtvvwjO4DmW4NZQNQMIUc1EgWrXIqELXXwXlyZXaQPkwPOhepVcGaak88/exec";

async function fetchLiveData() {
  const symbol = document.getElementById('stockSymbol').value.trim();
  if(!symbol) return;

  document.getElementById('signal').innerHTML = "Loading...";

  try {
    const res = await fetch(`${API_URL}?symbol=${encodeURIComponent(symbol)}`);
    const data = await res.json();

    if(data.error) {
      alert("Error: " + data.error);
      return;
    }

    const cmp = data.cmp;
    const prevClose = data.prevClose;
    const curOI = data.currentOI;
    const prevOI = data.prevOI;

    document.getElementById('cmp').innerText = `₹${cmp.toFixed(2)}`;
    document.getElementById('syncTime').innerText = `Updated: ${data.timestamp}`;

    const priceChange = cmp - prevClose;
    const oiChange = curOI - prevOI;
    const oiChangePercent = ((oiChange / prevOI) * 100).toFixed(2);

    let oiText = oiChange > 0 ? `▲ Badh raha hai (+${oiChangePercent}%)` : `▼ Ghat raha hai (${oiChangePercent}%)`;
    document.getElementById('oiTrend').innerText = oiText;

    let signalEl = document.getElementById('signal');
    let target = 0, sl = 0, msg = "";

    // Live Technical OI Matrix Logic
    if (priceChange > 0 && oiChange > 0) {
      signalEl.className = "action buy";
      signalEl.innerText = "BUY (Long Buildup)";
      target = cmp + (cmp * 0.02); // 2% Target
      sl = cmp - (cmp * 0.01);     // 1% SL
      msg = "Price aur OI dono badh rahe hain. Fresh buying active hai.";
    } 
    else if (priceChange < 0 && oiChange > 0) {
      signalEl.className = "action sell";
      signalEl.innerText = "SELL (Short Buildup)";
      target = cmp - (cmp * 0.02);
      sl = cmp + (cmp * 0.01);
      msg = "Price gir raha hai aur OI badh raha hai. Fresh sellers enter kar rahe hain.";
    } 
    else if (priceChange > 0 && oiChange < 0) {
      signalEl.className = "action buy";
      signalEl.innerText = "BUY (Short Covering)";
      target = cmp + (cmp * 0.015);
      sl = cmp - (cmp * 0.008);
      msg = "Price badh raha hai par OI ghat raha hai. Short positions cover ho rahi hain.";
    } 
    else if (priceChange < 0 && oiChange < 0) {
      signalEl.className = "action sell";
      signalEl.innerText = "EXIT / SELL (Long Unwinding)";
      target = cmp - (cmp * 0.015);
      sl = cmp + (cmp * 0.008);
      msg = "Price aur OI dono gir rahe hain. Buyers positions se nikal rahe hain.";
    }

    document.getElementById('target').innerText = `₹${target.toFixed(2)}`;
    document.getElementById('sl').innerText = `₹${sl.toFixed(2)}`;
    document.getElementById('interpretation').innerText = msg;

  } catch(err) {
    document.getElementById('signal').innerText = "Fetch Failed";
    console.error(err);
  }
}

// Auto scan on load & refresh every 60 seconds
window.onload = () => {
  fetchLiveData();
  setInterval(fetchLiveData, 60000);
};
</script>

</body>
</html>
